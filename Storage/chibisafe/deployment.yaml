# --- Persistent Volume Claim ---
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: pvc-chibisafe
# spec:
#   accessModes:
#     - ReadWriteMany
#   resources:
#     requests:
#       storage: 350Gi
#   storageClassName: nas-retain
# ---
# --- Chibisafe Deployment (Chibisafe Client, Chibisafe Server, and Caddy as sidecars) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chibisafe
  namespace: chibisafe
  labels:
    app: chibisafe
    app.kubernetes.io/instance: chibisafe
    app.kubernetes.io/name: chibisafe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chibisafe
  template:
    metadata:
      labels:
        app: chibisafe
        app.kubernetes.io/instance: chibisafe
        app.kubernetes.io/name: chibisafe
    spec:
      containers:
        # Chibisafe Client Container
        - name: chibisafe-client
          image: chibisafe/chibisafe:latest
          env:
            - name: BASE_API_URL
              value: "http://localhost:8000"
          ports:
            - containerPort: 8001
          volumeMounts:
            - name: chibisafe-data
              mountPath: /app/uploads
              subPath: uploads

        # Chibisafe Server Container
        - name: chibisafe-server
          image: chibisafe/chibisafe-server:latest
          volumeMounts:
            - name: chibisafe-data
              mountPath: /app/database
              subPath: database
            - name: chibisafe-data
              mountPath: /app/uploads
              subPath: uploads
            - name: chibisafe-data
              mountPath: /app/logs
              subPath: logs
          ports:
            - containerPort: 8000

        # Caddy Container (Sidecar)
        - name: caddy
          image: caddy:2-alpine
          env:
            - name: BASE_URL
              value: ":80"
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: chibisafe-data
              mountPath: /app/uploads
              subPath: uploads
          ports:
            - containerPort: 80

      volumes:
        - name: chibisafe-data
          persistentVolumeClaim:
            claimName: pvc-chibisafe
        - name: caddyfile
          configMap:
            name: caddy-config

---
# --- Chibisafe Client Service (Headless) ---
apiVersion: v1
kind: Service
metadata:
  name: chibisafe-client
spec:
  clusterIP: None
  selector:
    app: chibisafe
  ports:
    - port: 8001
      targetPort: 8001

---
# --- Chibisafe Server Service (Headless) ---
apiVersion: v1
kind: Service
metadata:
  name: chibisafe-server
spec:
  clusterIP: None
  selector:
    app: chibisafe
  ports:
    - port: 8000
      targetPort: 8000

---
# --- Chibisafe Router Service (ClusterIP) ---
apiVersion: v1
kind: Service
metadata:
  name: chibisafe-router
spec:
  selector:
    app: chibisafe
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
# --- ConfigMap for Caddy Configuration ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
data:
  Caddyfile: |
    {$BASE_URL} {
      route {
        file_server * {
          root /app/uploads
          pass_thru
        }

        @api path /api/*
        reverse_proxy @api http://localhost:8000 {
          header_up Host {http.reverse_proxy.upstream.hostport}
          header_up X-Real-IP {http.request.header.X-Real-IP}
        }

        @docs path /docs*
        reverse_proxy @docs http://localhost:8000 {
          header_up Host {http.reverse_proxy.upstream.hostport}
          header_up X-Real-IP {http.request.header.X-Real-IP}
        }

        reverse_proxy http://localhost:8001 {
          header_up Host {http.reverse_proxy.upstream.hostport}
          header_up X-Real-IP {http.request.header.X-Real-IP}
        }
      }
    }
